version: '3.8'

networks:
  # Réseau de la couche Core - connecté à Internet
  core-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
    driver_opts:
      com.docker.network.bridge.name: core-net

  # Réseau de la couche Agrégation - interconnexion entre Core et Edge
  agg-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
    driver_opts:
      com.docker.network.bridge.name: agg-net

  # Réseau de la couche Edge/MEC - pour les services en périphérie
  edge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
          gateway: 172.32.0.1
    driver_opts:
      com.docker.network.bridge.name: edge-net

services:
  # === CORE NETWORK FUNCTIONS ===
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    networks:
      core-network:
        aliases:
          - mongodb
        ipv4_address: 172.30.0.10
    volumes:
      - mongodbdata:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  nrf:
    image: free5gc/nrf:v4.0.0
    container_name: nrf
    expose: 
      - "8000"
    depends_on:
      - mongodb
    networks:
      core-network:
        ipv4_address: 172.30.0.11
    volumes:
      - ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/nrf", "-c", "/free5gc/config/nrfcfg.yaml"]
    restart: always

  amf:
    image: free5gc/amf:v4.0.0
    container_name: amf
    depends_on:
      - nrf
    networks:
      core-network:
        ipv4_address: 172.30.0.12
    volumes:
      - ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/amf", "-c", "/free5gc/config/amfcfg.yaml"]
    restart: always

  ausf:
    image: free5gc/ausf:v4.0.0
    container_name: ausf
    depends_on:
      - nrf
    environment:
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.13
    volumes:
      - ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/ausf", "-c", "/free5gc/config/ausfcfg.yaml"]
    restart: always

  nssf:
    image: free5gc/nssf:v4.0.0
    container_name: nssf
    depends_on:
      - nrf
    environment:
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.14
    volumes:
      - ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/nssf", "-c", "/free5gc/config/nssfcfg.yaml"]
    restart: always

  pcf:
    image: free5gc/pcf:v4.0.0
    container_name: pcf
    depends_on:
      - nrf
    environment:
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.15
    volumes:
      - ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/pcf", "-c", "/free5gc/config/pcfcfg.yaml"]
    restart: always
  smf:
    image: free5gc/smf:v4.0.0
    container_name: smf
    depends_on:
      - nrf
      - upf-edge1
      - upf-edge2
      - upf-agg1
      - upf-agg2
      - upf-core 
    networks:
      core-network:
        ipv4_address: 172.30.0.16
      agg-network:
        ipv4_address: 172.31.0.16
      edge-network:
        ipv4_address: 172.32.0.16
    volumes:
      - ./config/ULCL/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./cert:/free5gc/cert
      - ./config/ULCL/uerouting.yaml:/free5gc/config/uerouting.yaml
    command: ["/free5gc/smf", "-c", "/free5gc/config/smfcfg.yaml"]
    restart: always

  udm:
    image: free5gc/udm:v4.0.0
    container_name: udm
    depends_on:
      - nrf
      - mongodb
    environment:
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.17
    volumes:
      - ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/udm", "-c", "/free5gc/config/udmcfg.yaml"]
    restart: always

  udr:
    image: free5gc/udr:v4.0.0
    container_name: udr
    depends_on:
      - mongodb
      - nrf
    environment:
      DB_URI: mongodb://mongodb/free5gc
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.18
    ports:
      - "8001:8001"
    volumes:
      - ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/udr", "-c", "/free5gc/config/udrcfg.yaml"]
    restart: always

  chf:
    image: free5gc/chf:v4.0.0
    container_name: chf
    depends_on:
      - mongodb
      - nrf
      - webui
    environment:
      DB_URI: mongodb://mongodb/free5gc
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.19
    volumes:
      - ./config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/chf", "-c", "/free5gc/config/chfcfg.yaml"]
    restart: always
  
  nef:
    image: free5gc/nef:latest
    container_name: nef
    depends_on:
      - nrf
      - mongodb
    environment:
      GIN_MODE: release
    networks:
      core-network:
        ipv4_address: 172.30.0.20
    volumes:
      - ./config/nefcfg.yaml:/free5gc/config/nefcfg.yaml
      - ./cert:/free5gc/cert
    command: ["/free5gc/nef", "-c", "/free5gc/config/nefcfg.yaml"]
    restart: always

  # === CORE UPF ===
  upf-core:
    image: free5gc/upf:latest
    container_name: upf-core
    privileged: true
    depends_on:
      - nrf
      - internet-gateway
    networks:
      core-network:
        ipv4_address: 172.30.0.30
      agg-network:
        ipv4_address: 172.31.0.30
    volumes:
      - ./config/ULCL/upf-core.yaml:/free5gc/config/upfcfg.yaml
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: >
      /bin/bash -c "
      ip route add default via 172.30.0.1 dev eth0 &&
      /free5gc/upf -c /free5gc/config/upfcfg.yaml
      "
    restart: always
  # === AGGREGATION UPFs ===
  upf-agg1:
    image: free5gc/upf:latest
    container_name: upf-agg1
    privileged: true
    depends_on:
      - nrf
    networks:
      agg-network:
        ipv4_address: 172.31.0.31
      edge-network:
        ipv4_address: 172.32.0.31
    volumes:
      - ./config/ULCL/upf-agg1.yaml:/free5gc/config/upfcfg.yaml
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/free5gc/upf", "-c", "/free5gc/config/upfcfg.yaml"]
    restart: always

  upf-agg2:
    image: free5gc/upf:latest
    container_name: upf-agg2
    privileged: true
    depends_on:
      - nrf
    networks:
      agg-network:
        ipv4_address: 172.31.0.32
      edge-network:
        ipv4_address: 172.32.0.32
    volumes:
      - ./config/ULCL/upf-agg2.yaml:/free5gc/config/upfcfg.yaml
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/free5gc/upf", "-c", "/free5gc/config/upfcfg.yaml"]
    restart: always

  # === EDGE UPFs ===
  upf-edge1:
    image: free5gc/upf:latest
    container_name: upf-edge1
    privileged: true
    depends_on:
      - nrf
    networks:
      edge-network:
        ipv4_address: 172.32.0.33
    volumes:
      - ./config/ULCL/upf-edge1.yaml:/free5gc/config/upfcfg.yaml
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/free5gc/upf", "-c", "/free5gc/config/upfcfg.yaml"]
    restart: always

  upf-edge2:
    image: free5gc/upf:latest
    container_name: upf-edge2
    privileged: true
    depends_on:
      - nrf
    networks:
      edge-network:
        ipv4_address: 172.32.0.34
    volumes:
      - ./config/ULCL/upf-edge2.yaml:/free5gc/config/upfcfg.yaml
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/free5gc/upf", "-c", "/free5gc/config/upfcfg.yaml"]
    restart: always

  # === gNBs ===
  gnb1:
    image: free5gc/ueransim:latest
    container_name: gnb1
    privileged: true
    depends_on:
      - amf
    networks:
      edge-network:
        ipv4_address: 172.32.0.41
    volumes:
      - ./config/ULCL/gnb1.yaml:/free5gc/config/gnbcfg.yaml
      - ./config/ULCL/uecfg1.yaml:/free5gc/config/uercfg.yaml
    command: /bin/bash -c "./nr-gnb -c /free5gc/config/gnbcfg.yaml & ./nr-ue -c /free5gc/config/uercfg.yaml"
    restart: always

  gnb2:
    image: free5gc/ueransim:latest
    container_name: gnb2
    privileged: true
    depends_on:
      - amf
    networks:
      edge-network:
        ipv4_address: 172.32.0.42
    volumes:
      - ./config/ULCL/gnb2.yaml:/free5gc/config/gnbcfg.yaml
      - ./config/ULCL/uecfg2.yaml:/free5gc/config/uercfg.yaml
    command: /bin/bash -c "./nr-gnb -c /free5gc/config/gnbcfg.yaml & ./nr-ue -c /free5gc/config/uercfg.yaml"
    restart: always

  # === INTERFACE WEB ===
  webui:
    image: free5gc/webui:v4.0.0
    container_name: webui
    depends_on:
      - mongodb
    networks:
      core-network:
        ipv4_address: 172.30.0.50
    volumes:
      - ./config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/free5gc
    ports:
      - "5000:5000"
    command: ["./webui"]
    restart: always

  # === INTERNET GATEWAY ===
  internet-gateway:
    image: alpine:latest
    container_name: internet-gateway
    networks:
      core-network:
        ipv4_address: 172.30.0.254
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache iptables tcpdump curl
        echo 1 > /proc/sys/net/ipv4/ip_forward
        iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        
        # Règles spécifiques pour les différents flux
        iptables -A FORWARD -i eth0 -o eth0 -j ACCEPT
        iptables -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
        
        # Monitoring basique
        echo 'Gateway ready, forwarding enabled'
        
        # Rester actif
        while true; do sleep 3600; done
      "
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodbdata: