version: 1.0.3
description: UPF-Agg2 initial local configuration

pfcp:
  addr: upf-agg2.free5gc.org
  nodeID: upf-agg2.free5gc.org
  retransTimeout: 1s
  maxRetrans: 3

gtpu:
  forwarder: gtp5g
  ifList:
    - addr: upf-agg2-n9.free5gc.org
      type: N9

dnnList:
  - dnn: urllc
    cidr: 10.90.0.0/16
  - dnn: ims
    cidr: 10.91.0.0/16
    natIfname: eth0

logger:
  enable: true
  level: info
  reportCaller: false