info:
  version: 1.0.7
  description: SMF configuration for URLLC multi-UPF chaining

configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: 172.30.0.16
    bindingIPv4: 172.30.0.16
    port: 8000
    tls:
      key: cert/smf.key
      pem: cert/smf.pem
  serviceNameList:
    - nsmf-pdusession
    - nsmf-event-exposure
    - nsmf-oam
  nrfUri: http://172.30.0.11:8000
  snssaiInfos:
    - sNssai:
        sst: 1
        sd: 010203
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
        - dnn: urllc
          dns:
            ipv4: 8.8.8.8
        - dnn: mec
          dns:
            ipv4: 8.8.8.8
        - dnn: ims
          dns:
            ipv4: 8.8.8.8
  plmnList:
    - mcc: 208
      mnc: 93
  locality: area1
  pfcp:
    nodeID: 172.30.0.16
    forceDeletePFCP: true
    listenAddr: 172.30.0.16
    externalAddr: 172.30.0.16
    heartbeatInterval: 1s
  
  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
        nodeID: 172.32.0.41
      gNB2:
        type: AN
        nodeID: 172.32.0.42
      UPF-Edge1:
        type: UPF
        nodeID: 172.32.0.33
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16
              - dnn: urllc
                pools:
                  - cidr: 10.61.0.0/16
              - dnn: mec
                pools:
                  - cidr: 10.62.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.63.0.0/16
        interfaces:
          - interfaceType: N3
            endpoints:
              - 172.32.0.33
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
          - interfaceType: N9
            endpoints:
              - 172.32.0.33
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
      UPF-Edge2:
        type: UPF
        nodeID: 172.32.0.34
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.70.0.0/16
              - dnn: urllc
                pools:
                  - cidr: 10.71.0.0/16
              - dnn: mec
                pools:
                  - cidr: 10.72.0.0/16
        interfaces:
          - interfaceType: N3
            endpoints:
              - 172.32.0.34
            networkInstances:
              - internet
              - urllc
              - mec
          - interfaceType: N9
            endpoints:
              - 172.32.0.34
            networkInstances:
              - internet
              - urllc
              - mec
      UPF-Agg1:
        type: UPF
        nodeID: 172.31.0.31
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: mec
                pools:
                  - cidr: 10.80.0.0/16
              - dnn: internet
                pools:
                  - cidr: 10.81.0.0/16
        interfaces:
          - interfaceType: N9
            endpoints:
              - 172.31.0.31
              - 172.32.0.31
            networkInstances:
              - mec
              - internet
      UPF-Agg2:
        type: UPF
        nodeID: 172.31.0.32
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: urllc
                pools:
                  - cidr: 10.90.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.91.0.0/16
        interfaces:
          - interfaceType: N9
            endpoints:
              - 172.31.0.32
              - 172.32.0.32
            networkInstances:
              - urllc
              - ims
      UPF-Core:
        type: UPF
        nodeID: 172.30.0.30
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.100.0.0/16
              - dnn: urllc
                pools:
                  - cidr: 10.101.0.0/16
              - dnn: mec
                pools:
                  - cidr: 10.102.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.103.0.0/16
        interfaces:
          - interfaceType: N9
            endpoints:
              - 172.31.0.30
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
    links:
      - A: gNB1
        B: UPF-Edge1
      - A: gNB2
        B: UPF-Edge2
      
      - A: UPF-Edge1
        B: UPF-Agg1
      - A: UPF-Edge1
        B: UPF-Agg2
      - A: UPF-Edge2
        B: UPF-Agg1
      - A: UPF-Edge2
        B: UPF-Agg2
      
      - A: UPF-Edge1
        B: UPF-Core
      - A: UPF-Edge2
        B: UPF-Core
      
      - A: UPF-Agg1
        B: UPF-Core
      - A: UPF-Agg2
        B: UPF-Core

  ulcl: true  # Enable ULCL for traffic classification
  ulclRouteInfo:
  - dnn: urllc
    routeProfiles:
      - qfi: 1
        qos:
          5qi: 6
          arp:
            priorityLevel: 1
        route:
          - nodeId: UPF-Edge1
          - nodeId: UPF-Agg2
          - nodeId: UPF-Core
      - qfi: 2
        qos:
          5qi: 6
          arp:
            priorityLevel: 1
        route:
          - nodeId: UPF-Edge2
          - nodeId: UPF-Agg2
          - nodeId: UPF-Core
  - dnn: mec
    routeProfiles:
      - route:
          - nodeId: UPF-Edge1
          - nodeId: UPF-Agg1
          - nodeId: UPF-Core
      - route:
          - nodeId: UPF-Edge2
          - nodeId: UPF-Agg1
          - nodeId: UPF-Core
  - dnn: internet
    routeProfiles:
      - route:
          - nodeId: UPF-Edge1
          - nodeId: UPF-Core
      - route:
          - nodeId: UPF-Edge2
          - nodeId: UPF-Core
  - dnn: ims
    routeProfiles:
      - route:
          - nodeId: UPF-Edge1
          - nodeId: UPF-Agg2
          - nodeId: UPF-Core
      - route:
          - nodeId: UPF-Edge2
          - nodeId: UPF-Agg2
          - nodeId: UPF-Core

  t3591:
    enable: true
    expireTime: 5s
    maxRetryTimes: 2
  t3592:
    enable: true
    expireTime: 5s
    maxRetryTimes: 2
  nrfCertPem: cert/nrf.pem
  urrPeriod: 10
  urrThreshold: 1000
  requestedUnit: 1000
  

logger:
  enable: true
  level: debug
  reportCaller: false