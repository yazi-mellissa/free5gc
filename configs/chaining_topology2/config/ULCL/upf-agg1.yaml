version: 1.0.3
description: UPF-Agg1 initial local configuration

pfcp:
  addr: 172.31.0.31  # Adresse dans le réseau d'agrégation
  nodeID: 172.31.0.31 
  retransTimeout: 1s
  maxRetrans: 3

gtpu:
  forwarder: gtp5g
  ifList:
    - addr: 172.31.0.31  # Interface vers UPF-Core
      type: N9
      name: n9_core
    - addr: 172.32.0.31  # Interface vers UPF-Edge
      type: N9
      name: n9_edge

dnnList:
  - dnn: mec
    cidr: 10.80.0.0/16
  - dnn: internet
    cidr: 10.81.0.0/16

logger:
  enable: true
  level: info
  reportCaller: false