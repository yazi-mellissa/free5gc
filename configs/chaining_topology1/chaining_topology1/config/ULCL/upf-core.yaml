info:
  version: 1.0.0
  description: UPF Core configuration file

configuration:
  # PFCP related configuration
  pfcp:
    nodeID: upf-core.free5gc.org
    addr: upf-core.free5gc.org
    port: 8805
    heartbeatPeriod: 1000
    retransTimeout: 500
    maxRetrans: 3

  # GTPU related configuration
  gtpu:
    # N9 interface for UPF chaining
    n9Addr: upf-core-n9.free5gc.org
    # N6 interface for external network connectivity
    n6Addr: upf-core-n6.free5gc.org
    port: 2152

  # DNN configurations with large address pools
  dnn:
    internet:
      cidr: 10.100.0.0/16
      natEnable: true
    urllc:
      cidr: 10.101.0.0/16
      natEnable: true
    mec:
      cidr: 10.102.0.0/16
      natEnable: true
    ims:
      cidr: 10.103.0.0/16
      natEnable: true
      
  # Network connections
  network:
    # External network connectivity
    external:
      interface: "eth0"
      ipv4: "auto"
      gateway: "auto"

logger:
  enable: true
  level: info
  reportCaller: false