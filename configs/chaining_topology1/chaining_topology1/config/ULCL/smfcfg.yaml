info:
  version: 1.0.7
  description: SMF configuration for multi-UPF chaining with N9 interfaces

configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: smf.free5gc.org
    bindingIPv4: smf.free5gc.org
    port: 8000
    tls:
      key: cert/smf.key
      pem: cert/smf.pem
  serviceNameList:
    - nsmf-pdusession
    - nsmf-event-exposure
    - nsmf-oam
  snssaiInfos:
    - sNssai:
        sst: 1
        sd: 010203
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: urllc
          dns:
            ipv4: 8.8.8.8
        - dnn: mec
          dns:
            ipv4: 8.8.8.8
        - dnn: ims
          dns:
            ipv4: 8.8.8.8
  plmnList:
    - mcc: 208
      mnc: 93
  locality: area1
  pfcp:
    nodeID: smf.free5gc.org
    listenAddr: smf.free5gc.org
    externalAddr: smf.free5gc.org
    heartbeatInterval: 1s  # Reduced for faster failure detection in URLLC
  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
        nodeID: gnb1.free5gc.org
      gNB2:
        type: AN
        nodeID: gnb2.free5gc.org
      UPF-Edge1:
        type: UPF
        nodeID: upf-edge1.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16
              - dnn: urllc
                pools:
                  - cidr: 10.61.0.0/16
              - dnn: mec
                pools:
                  - cidr: 10.62.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.63.0.0/16
        interfaces:
          - interfaceType: N3
            endpoints:
              - upf-edge1-n3.free5gc.org
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
          - interfaceType: N9
            endpoints:
              - upf-edge1-n9.free5gc.org
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
      UPF-Edge2:
        type: UPF
        nodeID: upf-edge2.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.70.0.0/16
              - dnn: urllc
                pools:
                  - cidr: 10.71.0.0/16
              - dnn: mec
                pools:
                  - cidr: 10.72.0.0/16
        interfaces:
          - interfaceType: N3
            endpoints:
              - upf-edge2-n3.free5gc.org
            networkInstances:
              - internet
              - urllc
              - mec
          - interfaceType: N9
            endpoints:
              - upf-edge2-n9.free5gc.org
            networkInstances:
              - internet
              - urllc
              - mec
      UPF-Agg1:
        type: UPF
        nodeID: upf-agg1.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: mec
                pools:
                  - cidr: 10.80.0.0/16
              - dnn: internet
                pools:
                  - cidr: 10.81.0.0/16
        interfaces:
          - interfaceType: N9
            endpoints:
              - upf-agg1-n9.free5gc.org
            networkInstances:
              - mec
              - internet
      UPF-Agg2:
        type: UPF
        nodeID: upf-agg2.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: urllc
                pools:
                  - cidr: 10.90.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.91.0.0/16
        interfaces:
          - interfaceType: N9
            endpoints:
              - upf-agg2-n9.free5gc.org
            networkInstances:
              - urllc
              - ims
      UPF-Core:
        type: UPF
        nodeID: upf-core.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.100.0.0/16
              - dnn: urllc
                pools:
                  - cidr: 10.101.0.0/16
              - dnn: mec
                pools:
                  - cidr: 10.102.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.103.0.0/16
        interfaces:
          - interfaceType: N9
            endpoints:
              - upf-core-n9.free5gc.org
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
          - interfaceType: N6
            endpoints:
              - upf-core-n6.free5gc.org
            networkInstances:
              - internet
              - urllc
              - mec
              - ims
    links:
      # gNB to Edge UPF connections
      - A: gNB1
        B: UPF-Edge1
      - A: gNB2
        B: UPF-Edge2
      
      # Edge to Aggregation UPF connections
      - A: UPF-Edge1
        B: UPF-Agg1
      - A: UPF-Edge1
        B: UPF-Agg2
      - A: UPF-Edge2
        B: UPF-Agg1
      - A: UPF-Edge2
        B: UPF-Agg2
      
      # Direct Edge to Core connections (for baseline testing)
      - A: UPF-Edge1
        B: UPF-Core
      - A: UPF-Edge2
        B: UPF-Core
      
      # Aggregation to Core connections
      - A: UPF-Agg1
        B: UPF-Core
      - A: UPF-Agg2
        B: UPF-Core
  
  # Traffic steering conditions for ULCL
  trafficroutes:
    # URLLC traffic gets priority routing
    - destCidr: 172.16.100.0/24
      routingRule: "UPF-Edge1 -> UPF-Agg2 -> UPF-Core"
      qosId: 1  # QFI associated with URLLC traffic
    
    # MEC traffic stays local when possible
    - destCidr: 172.16.200.0/24
      routingRule: "UPF-Edge1 -> UPF-Agg1"
      dnn: "mec"
    
    # Default internet routing
    - destCidr: 0.0.0.0/0
      routingRule: "UPF-Edge1 -> UPF-Core"
      dnn: "internet"
  
  t3591:
    enable: true
    expireTime: 5s  # Reduced for faster recovery in URLLC
    maxRetryTimes: 2
  t3592:
    enable: true
    expireTime: 5s
    maxRetryTimes: 2
  nrfUri: http://nrf.free5gc.org:8000
  nrfCertPem: cert/nrf.pem
  urrPeriod: 10
  urrThreshold: 1000
  requestedUnit: 1000
  ulcl: true  # Enable ULCL for traffic classification

logger:
  enable: true
  level: info
  reportCaller: false