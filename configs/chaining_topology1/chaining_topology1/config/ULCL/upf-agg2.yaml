info:
  version: 1.0.0
  description: UPF Aggregation 2 configuration file (URLLC specialized)

configuration:
  # PFCP related configuration
  pfcp:
    nodeID: upf-agg2.free5gc.org
    addr: upf-agg2.free5gc.org
    port: 8805
    heartbeatPeriod: 1000
    retransTimeout: 500
    maxRetrans: 3

  # GTPU related configuration  
  gtpu:
    # Only N9 interfaces for aggregation UPFs
    n9Addr: upf-agg2-n9.free5gc.org
    port: 2152

  # URLLC optimization settings
  urllc:
    enable: true
    lowLatencyQueue: true
    priorityScheduling: true
    maxBufferDelay: 5 # in milliseconds

  # DNN configurations
  dnn:
    urllc:
      cidr: 10.90.0.0/16
      natEnable: false # Direct routing for URLLC
    ims:
      cidr: 10.91.0.0/16
      natEnable: true
      
  # QoS configuration (optimized for URLLC)
  qos:
    - qfi: 1 # URLLC
      mbr:
        uplink: 100000000 # 100 Mbps
        downlink: 100000000 # 100 Mbps
      priority: 10 # Higher priority
      packetDelayBudget: 10 # in milliseconds
      packetErrorRate: 0.00001 # Very low error rate for URLLC

logger:
  enable: true
  level: info
  reportCaller: false