info:
  version: 1.0.0
  description: UPF Edge1 configuration file

configuration:
  # PFCP related configuration
  pfcp:
    # The IP address of this UPF
    nodeID: upf-edge1.free5gc.org
    # External IP address for other NFs to communicate with this UPF
    addr: upf-edge1.free5gc.org
    # Control plane listening port number
    port: 8805
    # Heartbeat parameters
    heartbeatPeriod: 1000 # in milliseconds
    retransTimeout: 500 # in milliseconds
    maxRetrans: 3

  # GTPU related configuration
  gtpu:
    # The IP address of N3 interface on this UPF (toward RAN)
    n3Addr: upf-edge1-n3.free5gc.org
    # The IP address of N9 interfaces on this UPF (toward other UPFs)
    n9Addr: upf-edge1-n9.free5gc.org
    # N3/N9 GTPU listening port
    port: 2152

  # Uplink Classifier configuration
  ulcl:
    enable: true # Enable ULCL for this UPF

  # Buffering parameters for URLLC
  buffering:
    enable: true
    maxSize: 10 # in MB
    maxTime: 10 # in seconds

  # DNN configurations
  dnn:
    internet:
      cidr: 10.60.0.0/16
      natEnable: true
    urllc:
      cidr: 10.61.0.0/16
      natEnable: false # Direct routing for URLLC traffic
    mec:
      cidr: 10.62.0.0/16
      natEnable: false # Local breakout for MEC
    ims:
      cidr: 10.63.0.0/16
      natEnable: true
      
  # QoS configuration
  qos:
    - qfi: 1 # URLLC
      mbr:
        uplink: 100000000 # 100 Mbps
        downlink: 100000000 # 100 Mbps
      priority: 10 # Higher priority (lower number)
    - qfi: 2 # Standard internet
      mbr:
        uplink: 20000000 # 20 Mbps
        downlink: 50000000 # 50 Mbps
      priority: 30

logger:
  enable: true
  level: info
  reportCaller: false