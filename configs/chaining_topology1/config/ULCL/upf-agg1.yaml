info:
  version: 1.0.0
  description: UPF Aggregation 1 configuration file (MEC specialized)

configuration:
  # PFCP related configuration
  pfcp:
    nodeID: upf-agg1.free5gc.org
    addr: upf-agg1.free5gc.org
    port: 8805
    heartbeatPeriod: 1000
    retransTimeout: 500
    maxRetrans: 3

  # GTPU related configuration  
  gtpu:
    # Only N9 interfaces for aggregation UPFs
    n9Addr: upf-agg1-n9.free5gc.org
    port: 2152

  # MEC optimization settings
  mec:
    enable: true
    localBreakout: true
    dnsServer: "8.8.8.8"
    cacheSize: 1024 # MB for local content caching

  # DNN configurations
  dnn:
    mec:
      cidr: 10.80.0.0/16
      natEnable: false # Local breakout for MEC
    internet:
      cidr: 10.81.0.0/16
      natEnable: true
      
  # QoS configuration
  qos:
    - qfi: 1 # URLLC
      mbr:
        uplink: 100000000
        downlink: 100000000
      priority: 10
    - qfi: 2 # Standard internet
      mbr:
        uplink: 50000000
        downlink: 100000000
      priority: 20

logger:
  enable: true
  level: info
  reportCaller: false